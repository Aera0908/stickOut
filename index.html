          <p style="color: #9898A6; font-size: 16px; margin-bottom: 16px;">
            A <strong>stick diagram</strong> is a simplified, abstracted representation of a VLSI (Very-Large-Scale Integration) integrated circuit layout. It maps the topology of a CMOS circuit — showing transistors, wiring, and connections — without specifying exact physical dimensions.
          </p>
          <p style="color: #9898A6; font-size: 16px; margin-bottom: 16px;">
            Stick diagrams are essential in <strong>IC design education</strong> and early-stage <strong>CMOS layout planning</strong>. They bridge the gap between a circuit schematic and a full mask layout, helping engineers visualize how transistors, metal interconnects, polysilicon gates, and diffusion regions are physically arranged on silicon.
          </p>

            Standard VLSI layer color coding in StickOut:

            <li><strong>N-Diffusion</strong>: Green (#27AE60)</li>
            <li><strong>Contacts &amp; Vias</strong>: Black with white outline</li>
          </ul>
